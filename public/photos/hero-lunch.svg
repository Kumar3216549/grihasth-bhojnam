<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Factory workers having lunch together from steel thalis at a clean canteen table">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4E4"/>
      <stop offset="1" stop-color="#FBE6CB"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE8F3"/>
      <stop offset="1" stop-color="#EAF5F9"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0D2A6"/>
      <stop offset="1" stop-color="#E2B983"/>
    </linearGradient>
    <radialGradient id="steel" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#F7F9FB"/>
      <stop offset=".6" stop-color="#D5DBE1"/>
      <stop offset="1" stop-color="#AEB7C0"/>
    </radialGradient>
    <linearGradient id="steelV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#AEB7C0"/>
      <stop offset=".45" stop-color="#F2F5F8"/>
      <stop offset="1" stop-color="#A5AEB8"/>
    </linearGradient>
    <radialGradient id="roti" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#F3D29C"/>
      <stop offset="1" stop-color="#D9A464"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <g id="thali">
      <ellipse cx="0" cy="10" rx="128" ry="40" fill="#000" opacity=".12" filter="url(#soft)"/>
      <ellipse cx="0" cy="0" rx="125" ry="44" fill="url(#steel)"/>
      <ellipse cx="0" cy="-2" rx="108" ry="36" fill="#E4E8EC"/>
      <!-- rotis -->
      <ellipse cx="-48" cy="2" rx="46" ry="18" fill="url(#roti)"/>
      <ellipse cx="-52" cy="-4" rx="44" ry="17" fill="url(#roti)"/>
      <circle cx="-62" cy="-6" r="3" fill="#B97A3D" opacity=".7"/><circle cx="-40" cy="-2" r="2.5" fill="#B97A3D" opacity=".7"/><circle cx="-55" cy="2" r="2" fill="#B97A3D" opacity=".6"/>
      <!-- rice -->
      <ellipse cx="22" cy="14" rx="34" ry="14" fill="#FFFDF5"/>
      <ellipse cx="22" cy="10" rx="26" ry="9" fill="#FFFFFF"/>
      <!-- katori dal -->
      <ellipse cx="48" cy="-14" rx="30" ry="11" fill="url(#steelV)"/>
      <ellipse cx="48" cy="-16" rx="25" ry="8.5" fill="#E8B23A"/>
      <circle cx="42" cy="-17" r="2" fill="#8C5A1A"/><circle cx="54" cy="-15" r="1.8" fill="#3E7D33"/>
      <!-- katori sabji -->
      <ellipse cx="0" cy="-24" rx="27" ry="10" fill="url(#steelV)"/>
      <ellipse cx="0" cy="-26" rx="22" ry="7.5" fill="#7FA046"/>
      <circle cx="-6" cy="-27" r="3" fill="#F2C14E"/><circle cx="6" cy="-25" r="2.6" fill="#E07A3A"/>
      <!-- salad -->
      <ellipse cx="88" cy="8" rx="16" ry="7" fill="#F4F0E6"/>
      <circle cx="84" cy="6" r="4" fill="#D9473B"/><circle cx="92" cy="8" r="4" fill="#7DBB57"/><circle cx="88" cy="3" r="3" fill="#F7E8A6"/>
    </g>
    <g id="glass">
      <path d="M-14 -40 L14 -40 L11 0 L-11 0 Z" fill="#D7EEF6" opacity=".85"/>
      <path d="M-12 -24 L12 -24 L11 0 L-11 0 Z" fill="#A9D8EA" opacity=".8"/>
      <ellipse cx="0" cy="-40" rx="14" ry="4" fill="#EAF7FB"/>
    </g>
  </defs>

  <!-- wall -->
  <rect width="1200" height="900" fill="url(#wall)"/>
  <!-- big window with clean industrial estate outside -->
  <rect x="70" y="60" width="760" height="330" rx="18" fill="#F7E3C6"/>
  <rect x="88" y="78" width="724" height="294" rx="10" fill="url(#sky)"/>
  <g fill="#BFD6E0">
    <rect x="110" y="250" width="170" height="122"/>
    <path d="M110 250 l42 -30 l42 30 l42 -30 l44 30 Z"/>
    <rect x="300" y="220" width="210" height="152"/>
    <rect x="330" y="150" width="22" height="70"/>
    <rect x="370" y="170" width="22" height="50"/>
    <rect x="530" y="265" width="260" height="107"/>
    <path d="M530 265 l65 -35 l65 35 l65 -35 l65 35 Z"/>
  </g>
  <g fill="#A9C5D1">
    <rect x="320" y="250" width="36" height="24" rx="3"/><rect x="372" y="250" width="36" height="24" rx="3"/><rect x="424" y="250" width="36" height="24" rx="3"/>
    <rect x="560" y="300" width="44" height="26" rx="3"/><rect x="624" y="300" width="44" height="26" rx="3"/><rect x="688" y="300" width="44" height="26" rx="3"/>
  </g>
  <g fill="#9FCB8E">
    <circle cx="96" cy="350" r="34"/><circle cx="520" cy="352" r="28"/><circle cx="800" cy="345" r="36"/>
  </g>
  <circle cx="700" cy="140" r="38" fill="#FFF7DA" opacity=".9"/>
  <!-- window bars -->
  <rect x="446" y="78" width="10" height="294" fill="#F7E3C6"/>
  <rect x="88" y="222" width="724" height="8" fill="#F7E3C6"/>

  <!-- wall clock at lunch time 12:30 -->
  <g transform="translate(1000 170)">
    <circle r="70" fill="#FFFFFF" stroke="#F28C28" stroke-width="10"/>
    <g stroke="#2B1B0E" stroke-width="4" stroke-linecap="round">
      <line x1="0" y1="-52" x2="0" y2="-44"/><line x1="52" y1="0" x2="44" y2="0"/><line x1="0" y1="52" x2="0" y2="44"/><line x1="-52" y1="0" x2="-44" y2="0"/>
    </g>
    <line x1="0" y1="0" x2="0" y2="42" stroke="#2B1B0E" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="6" y2="-30" stroke="#2B1B0E" stroke-width="7" stroke-linecap="round"/>
    <circle r="6" fill="#F28C28"/>
  </g>
  <!-- plant -->
  <g transform="translate(1060 420)">
    <rect x="-34" y="0" width="68" height="70" rx="10" fill="#1E7B3A"/>
    <path d="M0 0 C -40 -40 -60 -90 -30 -120 C -10 -80 0 -40 0 0 Z" fill="#45A35D"/>
    <path d="M0 0 C 40 -50 70 -80 50 -130 C 20 -90 5 -50 0 0 Z" fill="#2A8A45"/>
    <path d="M0 0 C -10 -60 0 -110 20 -140 C 25 -90 15 -40 0 0 Z" fill="#74C186"/>
  </g>

  <!-- ===== PEOPLE (behind table) ===== -->
  <!-- Person 1: man, blue uniform, eating roti -->
  <g transform="translate(205 455)">
    <path d="M-110 230 C -110 120 -70 80 0 80 C 70 80 110 120 110 230 Z" fill="#2F5D8C"/>
    <path d="M-28 82 L0 120 L28 82 Z" fill="#DCE8F3"/>
    <rect x="-16" y="40" width="32" height="44" rx="10" fill="#B7764D"/>
    <ellipse cx="0" cy="0" rx="58" ry="66" fill="#C68A5E"/>
    <path d="M-60 -10 C -62 -70 -20 -82 10 -80 C 50 -78 66 -50 60 -12 C 50 -40 30 -50 0 -50 C -30 -50 -50 -40 -60 -10 Z" fill="#2B1B0E"/>
    <path d="M-30 6 q8 -8 16 0" stroke="#2B1B0E" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M14 6 q8 -8 16 0" stroke="#2B1B0E" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M-20 34 q20 18 40 0" fill="#7A2E1F"/>
    <path d="M-18 26 q18 -6 36 0" stroke="#2B1B0E" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- arm raising roti -->
    <path d="M70 120 C 100 150 110 90 80 40" stroke="#2F5D8C" stroke-width="40" fill="none" stroke-linecap="round"/>
    <circle cx="74" cy="30" r="22" fill="#C68A5E"/>
    <path d="M56 22 a26 18 -20 0 1 40 -6 l-4 18 a26 18 -20 0 1 -36 4 Z" fill="url(#roti)"/>
  </g>

  <!-- Person 2: woman worker, teal uniform, smiling -->
  <g transform="translate(455 470)">
    <path d="M-105 220 C -105 115 -65 78 0 78 C 65 78 105 115 105 220 Z" fill="#1B8A84"/>
    <path d="M-60 90 C -20 150 30 150 70 88 L60 84 C 25 130 -15 130 -50 86 Z" fill="#F28C28"/>
    <rect x="-15" y="40" width="30" height="42" rx="10" fill="#A86A43"/>
    <ellipse cx="0" cy="0" rx="54" ry="62" fill="#B7764D"/>
    <path d="M-58 10 C -66 -60 -20 -80 4 -78 C 44 -76 64 -46 56 10 C 50 -30 30 -46 0 -46 C -30 -46 -50 -30 -58 10 Z" fill="#1E120A"/>
    <circle cx="44" cy="-58" r="22" fill="#1E120A"/>
    <circle cx="0" cy="-30" r="4" fill="#D9473B"/>
    <path d="M-28 6 q8 -8 16 0" stroke="#1E120A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M12 6 q8 -8 16 0" stroke="#1E120A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M-18 28 q18 16 36 0" fill="#FFFFFF" stroke="#7A2E1F" stroke-width="3"/>
    <circle cx="-56" cy="12" r="5" fill="#F2C14E"/><circle cx="56" cy="12" r="5" fill="#F2C14E"/>
  </g>

  <!-- Person 3: man, grey uniform with safety vest, laughing -->
  <g transform="translate(705 460)">
    <path d="M-110 225 C -110 118 -70 80 0 80 C 70 80 110 118 110 225 Z" fill="#6B7480"/>
    <path d="M-80 100 L-40 225 L-10 225 L-45 92 Z" fill="#F6C343"/>
    <path d="M80 100 L40 225 L10 225 L45 92 Z" fill="#F6C343"/>
    <rect x="-44" y="150" width="88" height="10" fill="#E8EEF3" opacity=".9"/>
    <rect x="-16" y="40" width="32" height="44" rx="10" fill="#C68A5E"/>
    <ellipse cx="0" cy="0" rx="57" ry="64" fill="#D39A6F"/>
    <path d="M-58 -8 C -58 -72 -14 -80 6 -80 C 46 -78 62 -52 58 -8 C 46 -42 26 -54 0 -54 C -28 -54 -48 -42 -58 -8 Z" fill="#3A2A1E"/>
    <path d="M-30 4 q8 -9 16 0" stroke="#2B1B0E" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M14 4 q8 -9 16 0" stroke="#2B1B0E" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M-26 22 q26 -8 52 0" stroke="#3A2A1E" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M-20 32 q20 22 40 0 Z" fill="#7A2E1F"/>
    <path d="M-14 33 h28" stroke="#FFFFFF" stroke-width="4"/>
  </g>

  <!-- Person 4: young man, orange polo, talking -->
  <g transform="translate(955 470)">
    <path d="M-105 220 C -105 115 -65 78 0 78 C 65 78 105 115 105 220 Z" fill="#E07A2F"/>
    <path d="M-26 80 L0 112 L26 80 Z" fill="#B85E1C"/>
    <rect x="-15" y="40" width="30" height="42" rx="10" fill="#A86A43"/>
    <ellipse cx="0" cy="0" rx="54" ry="62" fill="#B7764D"/>
    <path d="M-56 -4 C -60 -70 -16 -84 10 -80 C 50 -76 62 -44 56 -4 C 48 -36 30 -50 2 -50 C -28 -50 -46 -36 -56 -4 Z" fill="#141010"/>
    <path d="M-50 -38 C -30 -66 20 -70 48 -46" stroke="#141010" stroke-width="16" fill="none" stroke-linecap="round"/>
    <circle cx="-20" cy="2" r="5" fill="#141010"/><circle cx="20" cy="2" r="5" fill="#141010"/>
    <path d="M-14 28 q14 10 28 0" stroke="#7A2E1F" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ===== TABLE ===== -->
  <path d="M0 640 L1200 640 L1200 900 L0 900 Z" fill="url(#table)"/>
  <rect x="0" y="630" width="1200" height="16" fill="#F6DDB6"/>
  <rect x="0" y="860" width="1200" height="40" fill="#C99A6B"/>
  <!-- arms resting on table -->
  <g fill="#2F5D8C"><ellipse cx="125" cy="662" rx="62" ry="24" transform="rotate(8 125 662)"/></g>
  <circle cx="182" cy="672" r="17" fill="#C68A5E"/>
  <g fill="#1B8A84"><ellipse cx="380" cy="664" rx="54" ry="24"/><ellipse cx="535" cy="664" rx="54" ry="24"/></g>
  <circle cx="575" cy="668" r="18" fill="#B7764D"/>
  <circle cx="428" cy="672" r="17" fill="#B7764D"/>
  <g fill="#6B7480"><ellipse cx="625" cy="660" rx="56" ry="25"/><ellipse cx="790" cy="660" rx="56" ry="25"/></g>
  <circle cx="755" cy="672" r="18" fill="#D39A6F"/>
  <circle cx="672" cy="668" r="17" fill="#D39A6F"/>
  <g fill="#E07A2F"><ellipse cx="880" cy="664" rx="54" ry="24"/><ellipse cx="1035" cy="664" rx="54" ry="24"/></g>
  <circle cx="1075" cy="676" r="18" fill="#B7764D"/>
  <circle cx="926" cy="672" r="17" fill="#B7764D"/>

  <!-- thalis -->
  <use href="#thali" transform="translate(215 735)"/>
  <use href="#thali" transform="translate(462 745)"/>
  <use href="#thali" transform="translate(712 738)"/>
  <use href="#thali" transform="translate(962 745)"/>

  <!-- steel 3-tier tiffin carrier -->
  <g transform="translate(1120 760)">
    <ellipse cx="0" cy="62" rx="52" ry="12" fill="#000" opacity=".15" filter="url(#soft)"/>
    <rect x="-44" y="-70" width="88" height="40" rx="10" fill="url(#steelV)"/>
    <rect x="-44" y="-26" width="88" height="40" rx="10" fill="url(#steelV)"/>
    <rect x="-44" y="18" width="88" height="40" rx="10" fill="url(#steelV)"/>
    <path d="M-50 60 V-80 Q0 -120 50 -80 V60" fill="none" stroke="#8A939C" stroke-width="7" stroke-linejoin="round"/>
  </g>
  <!-- glasses of water -->
  <use href="#glass" transform="translate(340 720)"/>
  <use href="#glass" transform="translate(588 724)"/>
  <use href="#glass" transform="translate(840 720)"/>
  <!-- yellow safety helmet resting on table -->
  <g transform="translate(70 800)">
    <ellipse cx="0" cy="18" rx="70" ry="14" fill="#000" opacity=".15" filter="url(#soft)"/>
    <path d="M-56 10 C -56 -50 56 -50 56 10 Z" fill="#F6C343"/>
    <rect x="-70" y="6" width="140" height="14" rx="7" fill="#E8B22E"/>
    <path d="M-8 -38 h16 v44 h-16 Z" fill="#FFD866"/>
  </g>
  <!-- warm light overlay -->
  <rect width="1200" height="900" fill="#FFB866" opacity=".06"/>
</svg>
